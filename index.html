<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --green-dark: #1b4332;
    --green-mid: #2d6a4f;
    --green-light: #40916c;
    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
  }

  body {
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    background: #f7f7f2;
    overscroll-behavior: none;
  }

  /* HEADER */
  .header {
    background: linear-gradient(160deg, var(--green-dark) 0%, var(--green-light) 100%);
    padding: calc(var(--safe-top) + 20px) 20px 20px;
    color: white;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }
  .header-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .header-icon { font-size: 28px; }
  .header-title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .header-sub { font-size: 12px; opacity: 0.75; margin-top: 2px; }

  /* SEARCH */
  .search-wrap { position: relative; }
  .search-wrap svg {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    opacity: 0.5; pointer-events: none;
  }
  .search-input {
    width: 100%;
    padding: 11px 16px 11px 38px;
    border-radius: 14px;
    border: none;
    font-size: 15px;
    background: rgba(255,255,255,0.18);
    color: white;
    outline: none;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .search-input::placeholder { color: rgba(255,255,255,0.6); }

  /* CATEGORY TABS */
  .tabs-wrap {
    background: white;
    overflow-x: auto;
    display: flex;
    gap: 8px;
    padding: 10px 14px;
    scrollbar-width: none;
    border-bottom: 1px solid #eee;
  }
  .tabs-wrap::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid #e0e0e0;
    background: white;
    color: #666;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .tab.active {
    background: var(--green-dark);
    border-color: var(--green-dark);
    color: white;
    font-weight: 600;
  }

  /* CONTENT */
  .content {
    padding: 14px 14px calc(var(--safe-bottom) + 30px);
  }

  .section { margin-bottom: 22px; }

  .section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .section-bar { width: 4px; height: 20px; border-radius: 2px; }
  .section-title { font-size: 15px; font-weight: 700; }
  .section-count {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    color: white;
    margin-left: auto;
  }

  .item {
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 8px;
    border-left: 3px solid;
  }
  .item-name {
    font-size: 14px;
    font-weight: 700;
    color: #111;
    margin-bottom: 5px;
  }
  .item-note {
    font-size: 11px;
    font-weight: 400;
    margin-left: 6px;
  }
  .methods { display: flex; flex-wrap: wrap; gap: 4px; }
  .method {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 10px;
    background: rgba(255,255,255,0.65);
    color: #444;
    border: 1px solid rgba(0,0,0,0.08);
  }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #aaa;
  }
  .empty-icon { font-size: 44px; margin-bottom: 12px; }

  /* FOOTER NOTE */
  .footer-note {
    background: #fff8e1;
    border-left: 3px solid #f59e0b;
    border-radius: 12px;
    padding: 14px;
    font-size: 12px;
    color: #555;
    line-height: 1.6;
    margin-bottom: 20px;
  }

  /* INSTALL BANNER */
  .install-banner {
    display: none;
    position: fixed;
    bottom: calc(var(--safe-bottom) + 16px);
    left: 14px; right: 14px;
    background: var(--green-dark);
    color: white;
    border-radius: 16px;
    padding: 14px 16px;
    font-size: 13px;
    z-index: 999;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    align-items: center;
    gap: 10px;
  }
  .install-banner.show { display: flex; }
  .install-text { flex: 1; line-height: 1.5; }
  .install-text strong { display: block; font-size: 14px; }
  .install-close {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    width: 28px; height: 28px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
</style>
</head>

let activeCategory = "Tümü";
let searchQuery = "";

function render() {
  const content = document.getElementById("content");
  const filtered = DATA
    .filter(cat => activeCategory === "Tümü" || cat.cat === activeCategory)
    .map(cat => ({
      ...cat,
      items: cat.items.filter(item =>
        item.n.toLowerCase().includes(searchQuery) ||
        (item.m || []).some(m => m.toLowerCase().includes(searchQuery)) ||
        (item.note || "").toLowerCase().includes(searchQuery)
      )
    }))
    .filter(cat => cat.items.length > 0);

  if (filtered.length === 0) {
    content.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><p>"${searchQuery}" için sonuç bulunamadı.</p></div>`;
    return;
  }

  content.innerHTML = filtered.map(cat => `
    <div class="section">
      <div class="section-header">
        <div class="section-bar" style="background:${cat.accent}"></div>
        <div class="section-title" style="color:${cat.accent}">${cat.cat}</div>
        <div class="section-count" style="background:${cat.accent}">${cat.items.length}</div>
      </div>
      ${cat.items.map(item => `
        <div class="item" style="background:${cat.color};border-left-color:${cat.accent}">
          <div class="item-name">
            ${item.n}
            ${item.note ? `<span class="item-note" style="color:${cat.accent}">${item.note}</span>` : ""}
          </div>
          <div class="methods">
            ${item.m.map(m => `<span class="method">${m}</span>`).join("")}
          </div>
        </div>
      `).join("")}
    </div>
  `).join("") + `
    <div class="footer-note">
      <strong style="color:#d97706">💡 Altın kural:</strong> Gıdanın kendisi değil, <strong>pişirme yöntemi</strong> belirleyici. Kızartma yerine fırın, haşlama veya ızgara. Tereyağı yerine zeytinyağı.
    </div>
  `;
}

function renderTabs() {
  const wrap = document.getElementById("tabsWrap");
  const cats = ["Tümü", ...DATA.map(d => d.cat)];
  wrap.innerHTML = cats.map(cat => `
    <button class="tab ${cat === activeCategory ? "active" : ""}" data-cat="${cat}">
      ${cat === "Tümü" ? "🌿 Tümü" : cat}
    </button>
  `).join("");
  wrap.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.cat;
      renderTabs();
      render();
      document.getElementById("content").scrollIntoView({ behavior: "smooth" });
    });
  });
}

document.getElementById("searchInput").addEventListener("input", e => {
  searchQuery = e.target.value.toLowerCase().trim();
  render();
});

// Install banner (iOS)
const isIOS = /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());
const isStandalone = window.navigator.standalone;
const dismissed = localStorage.getItem("install_dismissed");

if (isIOS && !isStandalone && !dismissed) {
  setTimeout(() => {
    document.getElementById("installBanner").classList.add("show");
  }, 2500);
}

document.getElementById("installClose").addEventListener("click", () => {
  document.getElementById("installBanner").classList.remove("show");
  localStorage.setItem("install_dismissed", "1");
});

// Service Worker
if ("serviceWorker" in navigator) {
  const swCode = `
    const CACHE = "kolesterol-v1";
    const ASSETS = [location.href];
    self.addEventListener("install", e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)));
    });
    self.addEventListener("fetch", e => {
      e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
    });
  `;
  const blob = new Blob([swCode], { type: "application/javascript" });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}

renderTabs();
render();
</script>
</body>
</html>
